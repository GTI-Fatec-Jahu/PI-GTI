<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Filmes</title>
    <style>
        /* 1. Resetando o padrão do navegador */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9; /* Um fundo cinza bem clarinho */
            color: #333; /* Texto cinza escuro para facilitar a leitura */
        }

        /* 2. Estilizando o Cabeçalho e o Menu */
        header {
            background-color: #2c3e50; /* Azul escuro */
            padding: 15px 0; /* 15px de espaço em cima e embaixo, 0 nas laterais */
        }

        .menu-principal {
            list-style-type: none; /* Remove as bolinhas da lista */
            display: flex; /* Ativa o Flexbox - Transforma a lista em uma linha */
            justify-content: center; /* Centraliza todos os itens horizontalmente */
            gap: 30px; /* Cria um espaço de 30px entre cada item do menu */
        }

        .menu-principal a {
            text-decoration: none; /* Remove o sublinhado padrão dos links */
            color: white; /* Deixa o texto branco */
            font-weight: bold;
            font-size: 16px;
            padding: 10px; /* Espaçamento interno para aumentar a área de clique */
            transition: color 0.3s; /* Faz a mudança de cor ser suave */
        }

        .menu-principal a:hover {
            color: #e74c3c; /* Muda a cor para vermelho quando o mouse passar por cima */
        }

        /* 3. Estilizando o Formulário */
        .container-form {
            max-width: 600px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .container-form h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .container-form p {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .grupo-input {
            margin-bottom: 20px;
        }

        .grupo-input label, .label-falso {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"],
        input[type="date"],
        input[type="time"],
        input[type="email"],
        input[type="url"],
        input[type="tel"],
        input[type="search"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #3498db;
            outline: none;
        }

        .linha-dupla {
            display: flex;
            gap: 15px;
        }
        .linha-dupla div {
            flex: 1;
        }

        .opcoes-inline {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .opcoes-inline label {
            display: inline;
            margin-bottom: 0;
            font-weight: normal;
            cursor: pointer;
        }

        .grupo-botoes {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        input[type="submit"], input[type="reset"] {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-enviar {
            background-color: #27ae60;
            color: white;
        }
        .btn-enviar:hover {
            background-color: #2ecc71;
        }

        .btn-limpar {
            background-color: #e74c3c;
            color: white;
        }
        .btn-limpar:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul class="menu-principal">
                <li><a href="#">Início</a></li>
                <li><a href="#">Catálogo</a></li>
                <li><a href="#">Cadastrar Filme</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <section class="container-form">
            <h2>Cadastro de Novo Filme</h2>
            <p>Preencha os dados abaixo com o máximo de detalhes.</p>

            <form action="#" method="POST">
                <div class="grupo-input">
                    <label for="titulo">Título do Filme:</label>
                    <input type="text" id="titulo" name="titulo" placeholder="Ex: Matrix" required>
                </div>

                <div class="grupo-input">
                    <label for="senha-admin">Senha do Administrador (para autorizar cadastro):</label>
                    <input type="password" id="senha-admin" name="senha-admin" required>
                </div>

                <div class="grupo-input linha-dupla">
                    <div>
                        <label for="ano">Ano de Lançamento:</label>
                        <input type="number" id="ano" name="ano" min="1888" max="2030">
                    </div>
                    <div>
                        <label for="data-estreia">Data de Estreia no Brasil:</label>
                        <input type="date" id="data-estreia" name="data-estreia">
                    </div>
                </div>

                <div class="grupo-input">
                    <label for="duracao">Duração da Exibição (Horas:Minutos):</label>
                    <input type="time" id="duracao" name="duracao">
                </div>

                <div class="grupo-input">
                    <label for="email-diretor">Email do Diretor:</label>
                    <input type="email" id="email-diretor" name="email-diretor" placeholder="diretor@estudio.com">
                </div>

                <div class="grupo-input">
                    <label for="trailer">Link do Trailer:</label>
                    <input type="url" id="trailer" name="trailer" placeholder="https://youtube.com/...">
                </div>

                <div class="grupo-input">
                    <label for="tel-distribuidora">Telefone da Distribuidora:</label>
                    <input type="tel" id="tel-distribuidora" name="tel-distribuidora" pattern="[0-9]{10,11}" placeholder="Ex: 11999999999">
                </div>

                <div class="grupo-input">
                    <p class="label-falso">Classificação Indicativa (Escolha UMA):</p>
                    <div class="opcoes-inline">
                        <input type="radio" id="livre" name="classificacao" value="Livre">
                        <label for="livre">Livre</label>

                        <input type="radio" id="maior14" name="classificacao" value="14">
                        <label for="maior14">+14</label>

                        <input type="radio" id="maior18" name="classificacao" value="18">
                        <label for="maior18">+18</label>
                    </div>
                </div>

                <div class="grupo-input">
                    <p class="label-falso">Gêneros (Escolha VÁRIAS):</p>
                    <div class="opcoes-inline">
                        <input type="checkbox" id="gen-acao" name="generos" value="Acao">
                        <label for="gen-acao">Ação</label>

                        <input type="checkbox" id="gen-comedia" name="generos" value="Comedia">
                        <label for="gen-comedia">Comédia</label>

                        <input type="checkbox" id="gen-drama" name="generos" value="Drama">
                        <label for="gen-drama">Drama</label>
                    </div>
                </div>

                <div class="grupo-input">
                    <label for="nota">Nota de Expectativa (0 a 10):</label>
                    <input type="range" id="nota" name="nota" min="0" max="10" step="1">
                </div>

                <div class="grupo-input linha-dupla">
                    <div>
                        <label for="poster">Pôster do Filme:</label>
                        <input type="file" id="poster" name="poster" accept="image/*">
                    </div>
                    <div>
                        <label for="cor-tema">Cor Tema do Filme:</label>
                        <input type="color" id="cor-tema" name="cor-tema" value="#ff0000">
                    </div>
                </div>

                <div class="grupo-input">
                    <label for="palavra-chave">Palavras-chave (Busca rápida):</label>
                    <input type="search" id="palavra-chave" name="palavra-chave">
                </div>

                <div class="grupo-botoes">
                    <input type="reset" value="Limpar Tudo" class="btn-limpar">
                    <input type="submit" value="Cadastrar Filme" class="btn-enviar">
                </div>
            </form>
        </section>
    </main>
</body>
</html>
